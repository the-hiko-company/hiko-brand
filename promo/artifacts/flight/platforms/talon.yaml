#
# talon — 1.5 m foam fixed wing. The reference fixed wing.
#
# A pure fixed wing has NO lift rotors: it cannot hover, and min_speed is a
# stall speed rather than a preference. Leaving min_speed at zero would let the
# trajectory layer command a hover, which the aircraft would attempt.
#
# Aero coefficients live with the simulator (hiko_sim_core FixedWingModel) --
# this catalogue carries what the FLIGHT stack needs, and a stack that reasoned
# about Cmq would be a stack pretending to be a simulator.

id: talon
name: X-UAV Talon (1.5 m fixed wing)
description: 1.5 m foam fixed wing, the reference FIXED_WING platform
class: fixed_wing

mass_kg: 1.4
inertia_diag_kg_m2: [0.045, 0.037, 0.075]

wing_area_m2: 0.35
wingspan_m: 1.5
chord_m: 0.24
forward_thrust_max_n: 6.0

surfaces:
  - name: aileron_left
    max_deflection_rad: 0.35
    direction: 1.0
  - name: aileron_right
    max_deflection_rad: 0.35
    # Opposite sign: an aileron pair is one surface type throwing both ways, and
    # matching signs rolls the aircraft the other way while every other number
    # still looks right.
    direction: -1.0
  - name: elevator
    max_deflection_rad: 0.35
    direction: 1.0
  - name: rudder
    max_deflection_rad: 0.30
    direction: 1.0

envelope:
  cruise_speed_m_s: 18.0
  max_speed_m_s: 28.0
  min_speed_m_s: 11.0         # stall; below this the wing stops working
  max_climb_rate_m_s: 4.0
  max_turn_rate_rad_s: 0.7
  max_accel_m_s2: 6.0
  endurance_s: 2700.0
  service_ceiling_agl_m: 400.0

footprint:
  # A 1.5 m span vehicle is not a 0.5 m one. hiko-nav hardcoded 0.5 m for
  # everything, which is wrong here by a factor of three.
  radius_m: 0.9
  height_m: 0.3
  safety_margin_m: 0.4
  min_altitude_agl_m: 15.0

sensors:
  - name: imu
    kind: imu
    topic: /hiko/hal/imu
    rate_hz: 250.0
  - name: gnss
    kind: gnss
    topic: /hiko/hal/gnss
    rate_hz: 10.0
  - name: baro
    kind: baro
    topic: /hiko/hal/baro
    rate_hz: 50.0
  - name: mag
    kind: mag
    topic: /hiko/hal/mag
    rate_hz: 100.0
  - name: camera
    kind: camera
    topic: /hiko/sensors/camera
    rate_hz: 20.0
    mount_pitch_rad: 0.35

# CAP_FIXED_WING_CRUISE | CAP_LONG_ENDURANCE | CAP_EO_SENSOR | CAP_WIDE_AREA_SURVEY
capabilities: 240

controller_plugin: hiko_controllers/CascadedController
mixer_plugin: hiko_control_api/FixedWingSurfaceMixer
